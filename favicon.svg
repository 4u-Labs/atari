<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0714"/>
      <stop offset="100%" stop-color="#1e0c2b"/>
    </linearGradient>
    <linearGradient id="atariRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Retro Plate -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="rgba(255,121,198,0.3)" stroke-width="6"/>

  <!-- Atari Fuji Logo / Retro Joystick Vector -->
  <!-- Middle Pillar -->
  <rect x="236" y="120" width="40" height="272" rx="10" fill="url(#atariRed)" filter="url(#neonGlow)"/>
  
  <!-- Left Curved Wing -->
  <path d="M 120 392 Q 130 220 200 160 L 200 240 Q 160 280 160 392 Z" fill="url(#atariRed)" filter="url(#neonGlow)"/>

  <!-- Right Curved Wing -->
  <path d="M 392 392 Q 382 220 312 160 L 312 240 Q 352 280 352 392 Z" fill="url(#atariRed)" filter="url(#neonGlow)"/>

  <!-- Base Bar -->
  <rect x="110" y="392" width="292" height="24" rx="8" fill="#ff79c6" filter="url(#neonGlow)"/>
</svg>
